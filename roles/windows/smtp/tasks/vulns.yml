---
# ========================================================
# Author: Andrew Xie
# Date Created: 03/30/2026
#
# Vulnerabilities:
# - Open SMTP relay (Initial Access / Pivoting vector)
# - Weak/default credentials (Already Configured in AD)
# - No authentication required for relay
# - Email enumeration via VRFY/EXPN commands enabled
# - Cleartext AUTH allowed (no TLS enforced)
# - No rate limiting (spam/phishing platform)
# ========================================================

- name: Install IIS SMTP Feature
  ansible.windows.win_feature:
    name:
      - SMTP-Server
      - Web-Server
    include_management_tools: true
    state: present
  register: smtp_install

- name: Reboot if required
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: smtp_install.reboot_required

