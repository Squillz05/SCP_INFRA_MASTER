---
# ========================================================
# Role: linux/wazuh-agent
# Description: Installs and configures the Wazuh agent on
#              Rocky Linux (dnf/rpm) and Ubuntu (apt) hosts.
#              Agent auto-enrolls with the Wazuh manager.
# Author: Grey Team
# Date Created: 04/03/2026
# ========================================================

# ----------------------------------------------------------
# 1. Add Wazuh repository — branch on OS family
# ----------------------------------------------------------

# --- Debian/Ubuntu path ---
- name: "[apt] Install Wazuh GPG key"
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /tmp/GPG-KEY-WAZUH
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: "[apt] Import Wazuh GPG key into keyring"
  ansible.builtin.shell:
    cmd: >
      gpg --no-default-keyring
      --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg
      --import /tmp/GPG-KEY-WAZUH
      && chmod 644 /usr/share/keyrings/wazuh.gpg
    creates: /usr/share/keyrings/wazuh.gpg
  when: ansible_os_family == "Debian"

- name: "[apt] Add Wazuh repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh
  when: ansible_os_family == "Debian"

# --- RHEL/Rocky path ---
- name: "[dnf] Import Wazuh GPG key"
  ansible.builtin.rpm_key:
    key: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    state: present
  when: ansible_os_family == "RedHat"

- name: "[dnf] Add Wazuh repository"
  ansible.builtin.yum_repository:
    name: wazuh
    description: "Wazuh {{ linux_wazuh_version }} repository"
    baseurl: https://packages.wazuh.com/4.x/yum/
    gpgcheck: true
    gpgkey: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    enabled: true
    protect: true
  when: ansible_os_family == "RedHat"

# ----------------------------------------------------------
# 2. Install wazuh-agent
# ----------------------------------------------------------
- name: "[apt] Install wazuh-agent"
  ansible.builtin.apt:
    name: "wazuh-agent={{ linux_wazuh_pkg_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
  environment:
    WAZUH_MANAGER: "{{ linux_wazuh_manager_ip }}"
  when: ansible_os_family == "Debian"

- name: "[dnf] Check installed wazuh-agent version"
  ansible.builtin.command:
    cmd: rpm -q --queryformat '%{VERSION}' wazuh-agent
  register: linux_dnf_wazuh_installed
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: "[dnf] Remove wazuh-agent if version mismatch"
  ansible.builtin.dnf:
    name: wazuh-agent
    state: absent
  when:
    - ansible_os_family == "RedHat"
    - linux_dnf_wazuh_installed.rc == 0
    - linux_dnf_wazuh_installed.stdout not in linux_wazuh_pkg_version

- name: "[dnf] Install wazuh-agent"
  ansible.builtin.dnf:
    name: "wazuh-agent-{{ linux_wazuh_pkg_version }}"
    state: present
  environment:
    WAZUH_MANAGER: "{{ linux_wazuh_manager_ip }}"
  when: ansible_os_family == "RedHat"

# ----------------------------------------------------------
# 2b. Install auditd (required for whodata FIM)
# ----------------------------------------------------------
- name: "[apt] Install auditd for whodata FIM"
  ansible.builtin.apt:
    name: auditd
    state: present
  when: ansible_os_family == "Debian"

- name: "[dnf] Install audit for whodata FIM"
  ansible.builtin.dnf:
    name: audit
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure auditd service is enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: Increase inotify watch limit for FIM
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    reload: true

# ----------------------------------------------------------
# 2c. Deploy auditd competition rules (command tracking)
# ----------------------------------------------------------
- name: Deploy auditd competition monitoring rules
  ansible.builtin.copy:
    content: |
      ## SCP Competition — auditd rules for forensic visibility
      ## Tracks process kills, password file changes, and Wazuh tampering
      -a always,exit -F arch=b64 -S execve -k competition_commands
      -a always,exit -F arch=b32 -S execve -k competition_commands
      -w /usr/bin/kill -p x -k process_kill
      -w /usr/bin/pkill -p x -k process_kill
      -w /usr/bin/killall -p x -k process_kill
      -w /etc/passwd -p wa -k password_file
      -w /etc/shadow -p wa -k password_file
      -w /etc/group -p wa -k group_file
      -w /var/ossec/etc/ossec.conf -p wa -k wazuh_config
    dest: /etc/audit/rules.d/competition.rules
    owner: root
    group: root
    mode: '0640'
  notify: Restart auditd

# ----------------------------------------------------------
# 2d. Deploy Wazuh agent watchdog cron (auto-restart if killed)
# ----------------------------------------------------------
- name: Deploy Wazuh agent watchdog cron job
  ansible.builtin.cron:
    name: "wazuh-agent-watchdog"
    minute: "*"
    job: "/usr/bin/systemctl is-active wazuh-agent > /dev/null 2>&1 || /usr/bin/systemctl restart wazuh-agent"
    user: root

# ----------------------------------------------------------
# 3. Deploy agent ossec.conf
# ----------------------------------------------------------
- name: Deploy agent ossec.conf
  ansible.builtin.template:
    src: ossec-agent.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0640'
  notify: Restart wazuh-agent

# ----------------------------------------------------------
# 4. Enable and start wazuh-agent
# ----------------------------------------------------------
- name: Enable and start wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true

# ----------------------------------------------------------
# 5. Verify agent is running and connected
# ----------------------------------------------------------
- name: Wait for agent to connect to manager (up to 60s)
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-control status
  register: agent_status
  changed_when: false
  retries: 6
  delay: 10
  until: "'wazuh-agentd is running' in agent_status.stdout"

- name: Display agent status
  ansible.builtin.debug:
    msg:
      - "Wazuh agent installed on {{ inventory_hostname }} ({{ ansible_host }})"
      - "Manager: {{ linux_wazuh_manager_ip }}:{{ linux_wazuh_manager_port }}"
      - "{{ agent_status.stdout_lines | join(' | ') }}"
