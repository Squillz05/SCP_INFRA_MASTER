---
# ========================================================
# Author: Andrew Xie
# Date Created: 03/26/2026
#
# This role sets up the SMB server with the necessary configurations to run without vulnerabilities.
#
# Configure the following:
# - Set hostname and DNS to point at DC
# - Join the AD domain
# - Install the File-Services Windows feature
# - Create share directories
# - Create SMB shares with defined permissions
# - Set NTFS ACLs on share directories
# ========================================================

# ----------------------------------------------------------
# 1. Ensure DNS resolves through the DC so domain join works
# ----------------------------------------------------------
- name: Set DNS server to DC IP
  ansible.windows.win_shell: |
    Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | ForEach-Object {
      Set-DnsClientServerAddress -InterfaceIndex $_.InterfaceIndex `
        -ServerAddresses ("{{ dc_ip_address }}")
    }
  changed_when: false

# ----------------------------------------------------------
# 2. Join the Active Directory domain
# ----------------------------------------------------------
- name: Check current domain membership
  ansible.windows.win_shell: |
    (Get-WmiObject Win32_ComputerSystem).Domain
  register: current_domain
  changed_when: false

- name: Join the AD domain
  ansible.windows.win_domain_membership:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_admin_user: "{{ ad_netbios_name }}\\{{ domain_join_user }}"
    domain_admin_password: "{{ domain_join_password }}"
    ou_path: "{{ server_ou }}"
    state: domain
  register: domain_join

# - name: Join the AD domain using PowerShell
#   ansible.windows.win_shell: |
#     $domain = "{{ ad_domain_name }}"
#     $netbios = "{{ ad_netbios_name }}"
