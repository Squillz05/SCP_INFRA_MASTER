---
- name: Restart wazuh-manager
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted
    daemon_reload: true

- name: Restart wazuh-indexer
  ansible.builtin.systemd:
    name: wazuh-indexer
    state: restarted

- name: Restart wazuh-dashboard
  ansible.builtin.systemd:
    name: wazuh-dashboard
    state: restarted
