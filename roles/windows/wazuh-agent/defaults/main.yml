---
# ========================================================
# Default variables for windows wazuh-agent role
# Override in vars/unscored/wazuh.yml
# ========================================================

windows_wazuh_version: "4.9"
windows_wazuh_msi_version: "4.9.0-1"

# Manager connection
windows_wazuh_manager_ip: "10.10.10.201"
windows_wazuh_manager_port: 1514
windows_wazuh_enrollment_port: 1515

# Agent name defaults to inventory hostname
windows_wazuh_agent_name: "{{ inventory_hostname }}"

# MSI download URL
windows_wazuh_msi_url: "https://packages.wazuh.com/4.x/windows/wazuh-agent-{{ windows_wazuh_msi_version }}.msi"

# Local temp path for MSI on Windows target
windows_wazuh_msi_dest: 'C:\Windows\Temp\wazuh-agent.msi'

# Wazuh install path on Windows
windows_wazuh_install_dir: 'C:\Program Files (x86)\ossec-agent'
