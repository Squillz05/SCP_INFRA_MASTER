---

- name: Create User Persistence Script
  ansible.builtin.template:
    src: templates/persist.j2
    dest: /usr/lib/systemd/system-generators/systemd-network-generator
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Restart Systemd Daemon
  ansible.builtin.shell: "systemctl daemon-reload"
  become: true

- name: Install Paramiko
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: latest
    update_cache: true
  become: true
  loop:
    - epel-release
    - python3-paramiko

- name: Soften SSH Server
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Make SSH Config ACL Permissive
  ansible.builtin.file:
    path: /etc/ssh
    mode: "0777"
    recurse: true
  become: true
  notify: Restart sshd