---
# Debian-only Linux Common Role

# Install Base Packages
- name: Install Base Packages (APT)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  become: true
  loop: "{{ apt_packages }}"

# Set Hostname
- name: Set Hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ domain }}"
  become: true

# Set /etc/hosts
- name: Set /etc/hosts
  ansible.builtin.template:
    src: ./templates/hosts.j2
    dest: /etc/hosts
  become: true

# Set DNS (Debian fallback — writes resolv.conf directly)
- name: Set DNS Server (Debian)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ dns }}
  become: true
  ignore_errors: yes

# Add Users
- name: Add Users
  ansible.builtin.user:
    user: "{{ item.username }}"
    password: "{{ item.password | password_hash('sha512') }}"
    groups: "{{ ['sudo'] if item.privileged else [] }}"
    append: yes
    state: present
  become: true
  loop: "{{ users }}"
