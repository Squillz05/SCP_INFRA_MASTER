# ----------------------------------------------------------
# 3. Install Windows File Server features
# ----------------------------------------------------------
- name: Install File Server role and tools
  ansible.windows.win_feature:
    name:
      - FS-FileServer
      - FS-SMB1          # kept for lab compatibility; disable in production
    include_management_tools: true
    state: present
  register: fs_install

- name: Reboot if feature installation requires it
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: fs_install.reboot_required

# ----------------------------------------------------------
# 4. Create share root directories
# ----------------------------------------------------------
- name: Create share directories
  ansible.windows.win_file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ smb_shares }}"

# ----------------------------------------------------------
# 5. Create SMB shares
# ----------------------------------------------------------
- name: Create SMB shares
  ansible.windows.win_shell: |
    $shareName = "{{ item.name }}"
    $sharePath = "{{ item.path }}"
    $description = "{{ item.description | default('') }}"

    # Remove existing share if present so settings are idempotent
    if (Get-SmbShare -Name $shareName -ErrorAction SilentlyContinue) {
      Remove-SmbShare -Name $shareName -Force
    }

    New-SmbShare `
      -Name $shareName `
      -Path $sharePath `
      -Description $description `
      -FullAccess "{{ item.full_access | default('Administrators') }}" `
      {% if item.read_access is defined %}-ReadAccess "{{ item.read_access }}" `{% endif %}
      {% if item.change_access is defined %}-ChangeAccess "{{ item.change_access }}" `{% endif %}
      -FolderEnumerationMode AccessBased
  loop: "{{ smb_shares }}"

# ----------------------------------------------------------
# 6. Set NTFS permissions on share directories
# ----------------------------------------------------------
- name: Set NTFS ACLs on share directories
  ansible.windows.win_acl:
    path: "{{ item.path }}"
    user: "{{ item.ntfs_owner | default('BUILTIN\\Administrators') }}"
    rights: FullControl
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  loop: "{{ smb_shares }}"

# ----------------------------------------------------------
# 7. Ensure SMB server service is running and set to auto-start
# ----------------------------------------------------------
- name: Ensure LanmanServer (SMB) service is running
  ansible.windows.win_service:
    name: LanmanServer
    start_mode: auto
    state: started

# ----------------------------------------------------------
# 8. Open firewall for SMB
# ----------------------------------------------------------
- name: Allow SMB through Windows Firewall
  ansible.windows.win_shell: |
    Enable-NetFirewallRule -DisplayGroup "File and Printer Sharing" -ErrorAction SilentlyContinue
    New-NetFirewallRule `
      -DisplayName "Allow SMB Inbound" `
      -Direction Inbound `
      -Protocol TCP `
      -LocalPort 445 `
      -Action Allow `
      -ErrorAction SilentlyContinue
  changed_when: false