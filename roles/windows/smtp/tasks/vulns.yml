- name: Disable SMTP authentication requirement
  ansible.windows.win_shell: |
    $iis = New-Object System.DirectoryServices.DirectoryEntry("IIS://localhost/smtpsvc/1")
    $iis.Put("AuthFlags", 1)           # 1 = Anonymous only, no auth required
    $iis.SetInfo()

- name: Enable VRFY and EXPN commands (user enumeration)
  ansible.windows.win_shell: |
    $iis = New-Object System.DirectoryServices.DirectoryEntry("IIS://localhost/smtpsvc/1")
    $iis.Put("HideServerInEnvelopeFrom", $false)
    $iis.SetInfo()

- name: Allow cleartext authentication (no TLS enforced)
  ansible.windows.win_shell: |
    $iis = New-Object System.DirectoryServices.DirectoryEntry("IIS://localhost/smtpsvc/1")
    $iis.Put("LogonMethod", 0)         # Cleartext logon
    $iis.SetInfo()

# Add in case if AD has been locked down too hard during competition
# - name: Create weak local mail users
#   ansible.windows.win_user:
#     name: "{{ item.username }}"
#     password: "{{ item.password }}"
#     password_never_expires: true
#     account_disabled: false
#     state: present
#   loop: "{{ smtp_users }}"
#   failed_when: false

- name: Set mail drop directory permissions to Everyone
  ansible.windows.win_acl:
    path: "C:\\Inetpub\\mailroot\\Drop"
    user: "Everyone"
    rights: FullControl
    type: allow
    state: present

- name: Start and set SMTP service to auto-start
  ansible.windows.win_service:
    name: SMTPSVC
    state: started
    start_mode: auto

- name: Create files onto SMTP
  ansible.windows.win_copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
  loop: "{{ smtp_files }}"

- name: Reboot if required after SMTPSVC configuration
  ansible.windows.win_reboot:
    reboot_timeout: 600
