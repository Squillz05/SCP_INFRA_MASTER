---
# ========================================================
# Default variables for wazuh-manager role
# Override in vars/unscored/wazuh.yml
# ========================================================

unscored_wazuh_version: "4.9"

# Wazuh manager network
unscored_wazuh_manager_ip: "{{ ansible_host }}"

# Agent enrollment (port 1515 — no password, auto-enroll)
unscored_wazuh_enrollment_enabled: "yes"
unscored_wazuh_enrollment_port: 1515
unscored_wazuh_enrollment_use_password: "no"

# Agent communication
unscored_wazuh_manager_port: 1514
unscored_wazuh_manager_protocol: "tcp"

# Dashboard
unscored_wazuh_dashboard_port: 443

# File integrity monitoring — paths watched on the manager itself
unscored_wazuh_fim_dirs:
  - /etc
  - /usr/bin
  - /usr/sbin
  - /opt/scp-scoring

unscored_wazuh_fim_frequency: 300   # seconds between FIM scans

# Alert levels
unscored_wazuh_alert_log_level: 3
unscored_wazuh_email_notification: "no"
