---
# ========================================================
# Default variables for linux wazuh-agent role
# Override in vars/unscored/wazuh.yml
# ========================================================

linux_wazuh_version: "4.9"

# Manager connection — set this to the Wazuh manager IP
linux_wazuh_manager_ip: "10.10.10.201"
linux_wazuh_manager_port: 1514
linux_wazuh_manager_protocol: "tcp"
linux_wazuh_enrollment_port: 1515

# Agent name defaults to inventory hostname
linux_wazuh_agent_name: "{{ inventory_hostname }}"

# File integrity monitoring dirs — competition-specific paths watched on agents
linux_wazuh_agent_fim_dirs:
  - /etc
  - /usr/bin
  - /usr/sbin
  - /home
  - /root
  - /opt

linux_wazuh_agent_fim_frequency: 300
