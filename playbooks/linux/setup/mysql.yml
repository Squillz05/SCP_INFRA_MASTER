- name: Setup MySQL Server
  hosts: mysql_servers
  become: true
  gather_facts: true

  vars_files:
    - ../../../vars/linux/common.yml
    - ../../../vars/linux/mysql.yml

  roles:
    - linux/common
    - linux/mysql

