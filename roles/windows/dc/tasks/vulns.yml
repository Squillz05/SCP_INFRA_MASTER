---
# ========================================================
# Author: Andrew Xie
# Date Created: 03/26/2026
#
# Role to add vulnerabilities to a DC
# Configure the following:
# - Weak Service Account Passwords
# - Disabled SMB/LDAP Signing via GPO
# - Weak password policies
# - Disabled Windows Defender Antivirus
# ========================================================

- name: Configure vulnerable GPO settings
  ansible.windows.win_shell: |
    Import-Module GroupPolicy
    # Create GPO if missing
    if (-not (Get-GPO -Name "{{ item.name }}" -ErrorAction SilentlyContinue)) {
      New-GPO -Name "{{ item.name }}"
      New-GPLink -Name "{{ item.name }}" -Target "DC=scp,DC=com" -Enforced Yes
    }
    
    # Check if registry value is already set correctly
    $current = Get-GPRegistryValue `
      -Name "{{ item.name }}" `
      -Key "{{ item.key }}" `
      -ValueName "{{ item.value_name }}" `
      -ErrorAction SilentlyContinue

    if ($current -and $current.Value -eq {{ item.value }}) {
      Write-Output "SKIPPED - already configured"
    } else {
      Set-GPRegistryValue `
        -Name "{{ item.name }}" `
        -Key "{{ item.key }}" `
        -ValueName "{{ item.value_name }}" `
        -Type "{{ item.type }}" `
        -Value {{ item.value }}
      Write-Output "CHANGED - value applied"
    }
  loop: "{{ vulnerable_gpo_settings }}"
  register: gpo_result
  changed_when: "'CHANGED' in gpo_result.stdout"


- name: Create AD service accounts with SPNs (Kerberoastable)
  community.windows.win_domain_user:
    name: "{{ item.username }}"
    password: "{{ item.password }}"
    user_cannot_change_password: false
    password_never_expires: true
    description: "{{ item.description }}"
    path: "{{ item.ou }}"
    state: present
    spn:
      - "{{ item.spn }}"
  loop: "{{ vulnerable_users }}"

- name: Create GPO Flag
  ansible.windows.win_shell: |
    Import-Module GroupPolicy
    if (-not (Get-GPO -Name "Domain Wallpaper Policy" -ErrorAction SilentlyContinue)) {
      New-GPO -Name "Domain Wallpaper Policy" -Comment "CONFIDENTIAL{Wh0mS!_D4r3_v13W_tH1$}" 
      New-GPLink -Name "Domain Wallpaper Policy" -Target "DC=scp,DC=com"
    }

- name : Create regulars docs
  ansible.windows.win_copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
  loop: "{{ regular_docs }}"

- name: Create Flag File (Easy Location)
  ansible.windows.win_copy:
    content: "CONFIDENTIAL{B4nAn4$_1s_4l$0_a_$3cur3_fru1t}"
    dest: "C:\\Users\\Public\\Documents\\SCP013.txt"

- name: Create Flag File (Admin Location)
  ansible.windows.win_copy:
    content: "CONFIDENTIAL{SCP_096_1s_4l$0_a_vu1n3r4bl3_m4n}"
    dest: "C:\\Windows\\System32\\SCP096.txt"
