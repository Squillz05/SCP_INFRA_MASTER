---
# =============================================
# Playbook Name: setup-ad.yml
# Description: Sets up an Active Directory Domain Controller
# Author: Andrew Xie
# Date Created: 03/26/2026
#
# Requirements needed to be performed before running this playbook:
# - Ensure the target server(s) are running Windows Server 2019 or later
# - Ensure the Ansible control machine has network connectivity to the target server(s)
# - Ensure that the target server has OpenSSH installed and running for Ansible Connectivity through the following items
#  - Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
#  - Start-Service sshd
#  - Set-Service -Name sshd -StartupType 'Automatic'
# Ensure theres no firewall blocking SSH access to the target server(s) through the following items:
#  - Get-NetFirewallPortFilter | Where-Object { $_.LocalPort -eq 22 }
#  - New-NetFirewallRule -Name "OpenSSH-22" -DisplayName "OpenSSH Server (sshd)" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
# Ensure SMB2 Protocol is properly enabled
#  - Set-SmbServerConfiguration -EnableSMB2Protocol $true
# =============================================

- name: Setup Active Directory Domain Controller
  hosts: domain_controllers
  gather_facts: yes
  vars_files:
    - ../vars/ad-config.yml

  tasks:
    - name: Set timezone to UTC
      win_timezone:
        timezone: "UTC"

    - name: Set computer name
      win_hostname:
        name: "{{ dc_hostname }}"
      register: hostname_change

    - name: Reboot if hostname changed
      win_reboot:
      when: hostname_change.reboot_required

  roles:
    - dc
    - ad-users

  post_tasks:
    - name: Display completion message
      debug:
        msg: "Active Directory setup complete for domain {{ domain_name }}"
